name: Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build Lambda package
        run: |
          cd app/lambda
          ./build.sh

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name portfolio-contact-prod \
            --zip-file fileb://app/lambda/lambda.zip \
            --publish

      - name: Deploy static site to S3
        run: |
          # Deploy assets with long cache
          aws s3 sync app/site/ s3://portfolio-prod-rrigel \
            --delete \
            --cache-control "max-age=31536000" \
            --exclude "index.html" \
            --exclude "script.js"
          
          # Deploy HTML/JS with no-cache
          aws s3 sync app/site/ s3://portfolio-prod-rrigel \
            --exclude "*" \
            --include "index.html" \
            --include "script.js" \
            --cache-control "max-age=0,no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E364HA5CJUYPG \
            --paths "/*"
