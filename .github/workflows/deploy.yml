name: Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC token
        run: |
          echo "=== OIDC Environment Variables ==="
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: $ACTIONS_ID_TOKEN_REQUEST_URL"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: [REDACTED]"
          echo ""
          echo "=== Requesting OIDC Token ==="
          TOKEN_RESPONSE=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          echo "$TOKEN_RESPONSE" | jq .
          echo ""
          echo "=== Decoding JWT Payload ==="
          JWT=$(echo "$TOKEN_RESPONSE" | jq -r '.value')
          PAYLOAD=$(echo "$JWT" | cut -d'.' -f2)
          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq . || echo "$PAYLOAD" | base64 -d 2>/dev/null
          echo ""
          echo "=== Repository Info ==="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Repository Owner: $GITHUB_REPOSITORY_OWNER"
          echo "Event Name: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build Lambda package
        run: |
          cd app/lambda
          ./build.sh

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name portfolio-contact-prod \
            --zip-file fileb://app/lambda/lambda.zip \
            --publish

      - name: Deploy static site to S3
        run: |
          # Deploy assets with long cache
          aws s3 sync app/site/ s3://portfolio-prod-rrigel \
            --delete \
            --cache-control "max-age=31536000" \
            --exclude "index.html" \
            --exclude "script.js"
          
          # Deploy HTML/JS with no-cache
          aws s3 sync app/site/ s3://portfolio-prod-rrigel \
            --exclude "*" \
            --include "index.html" \
            --include "script.js" \
            --cache-control "max-age=0,no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E364HA5CJUYPG \
            --paths "/*"
